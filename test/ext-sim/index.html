<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Extension simulator</title>
  <script src="/dist/hook.js"></script>
  <script src="sim.js"></script>
  <script src="/dist/content.js"></script>
  <style>
    html, body { margin: 0; height: 100%; background: #111; color: #ddd; font: 12px system-ui; }
    body { display: flex; }
    #stage { flex: 1; position: relative; }
    #stage canvas { width: 100%; height: 100%; display: block; }
    #side { width: 390px; display: flex; flex-direction: column; border-left: 1px solid #333; background: #1b1d22; }
    #side .bar { padding: 6px 10px; border-bottom: 1px solid #333; }
    #popup { flex: 1; border: 0; }
    #result-wrap { position: fixed; inset: 0; z-index: 10; display: flex; flex-direction: column; background: #16181d; }
    #result-wrap iframe { flex: 1; border: 0; }
    #result-wrap button { position: absolute; right: 10px; bottom: 10px; z-index: 2; }
  </style>
</head>
<body>
  <div id="stage"><canvas></canvas></div>
  <aside id="side"><div class="bar">Popup (simulated) · badge: <b id="badge">—</b></div></aside>
  <script type="module" src="/test/scenes/raw-scene.js"></script>
</body>
</html>
